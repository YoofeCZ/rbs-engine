name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        run: cmake --build build --config Release --parallel

      # Example plugins in C, C++, Rust and C#. Missing toolchains are skipped by the
      # scripts, an installed toolchain that fails to build fails the job.
      - name: Set up MSVC (Windows plugins)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build example plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: sdk/build_examples.ps1

      - name: Build example plugins (Linux, macOS)
        if: runner.os != 'Windows'
        run: sdk/build_examples.sh

      - name: Smoke test (game, editor, mods, plugins)
        if: runner.os == 'Linux'
        run: tools/smoke_test.sh build/rbs build/smoke

      - name: Upload screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: build/smoke/
          if-no-files-found: ignore

      - name: Package
        run: cmake --install build --config Release --component game --prefix dist/rbs-engine

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: rbs-engine-${{ matrix.name }}
          path: dist/
